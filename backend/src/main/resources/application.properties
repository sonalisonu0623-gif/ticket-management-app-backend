# ─── Server ───────────────────────────────────────────────────
server.port=${PORT:8080}

# ─── Database ─────────────────────────────────────────────────
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/ticketops?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Connection Pool
spring.datasource.hikari.maximum-pool-size=15
spring.datasource.hikari.minimum-idle=3
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# ─── JPA / Hibernate ──────────────────────────────────────────
spring.jpa.hibernate.ddl-auto=create
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=false

# ─── JWT ──────────────────────────────────────────────────────
app.jwt.secret=${APP_JWT_SECRET:v9B2F6b7C1D4e7F0G3h2I5j8K1l4M7n0O3p6Q9r2S5t8U1v4W7x0Y3zA1B2C3D4E5F6G7H8}
app.jwt.expiration-ms=${APP_JWT_EXPIRATION_MS:86400000}

# ─── CORS ─────────────────────────────────────────────────────
app.cors.allowed-origins=${FRONTEND_URL:*}

# ─── Jackson ──────────────────────────────────────────────────
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.date-format=yyyy-MM-dd'T'HH:mm:ss
spring.jackson.deserialization.fail-on-unknown-properties=false
spring.jackson.serialization.fail-on-empty-beans=false
spring.jackson.default-property-inclusion=non_null

# ─── Logging ──────────────────────────────────────────────────
logging.level.com.ticketsystem=INFO
logging.level.org.springframework.web=WARN
logging.level.org.hibernate.SQL=WARN
logging.level.org.springframework.security=WARN

# ─── SLA Business Hours ───────────────────────────────────────
app.sla.shift-start-hour=9
app.sla.shift-end-hour=18
