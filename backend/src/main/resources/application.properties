# Server Configuration
server.port=${PORT:8080}

# Database Configuration
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Run schema.sql and data.sql
spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true

# Jackson - handle LocalDateTime serialization
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.date-format=yyyy-MM-dd'T'HH:mm:ss

# CORS
spring.web.cors.allowed-origins=${FRONTEND_URL}

# Logging
logging.level.com.ticketsystem=DEBUG
logging.level.org.springframework.web=INFO
# JWT Configuration
jwt.secret=${JWT_SECRET:nexus-ticketing-super-secret-key-change-in-production-min-256-bits}
jwt.expiration=${JWT_EXPIRATION:86400000}
