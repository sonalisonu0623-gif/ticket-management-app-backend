# ─── Server ───────────────────────────────────────────────────
server.port=${PORT:8080}

# ─── Database ─────────────────────────────────────────────────
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
app.jwt.secret=${APP_JWT_SECRET:v9B2F6b7C1D4e7F0G3h2I5j8K1l4M7n0O3p6Q9r2S5t8U1v4W7x0Y3zA1B2C3D4E5F6G7H8}
# Connection pool tuning
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000

# ─── JPA / Hibernate ──────────────────────────────────────────
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.properties.hibernate.format_sql=false
# Disable open-in-view to avoid performance issues and LazyInitializationExceptions
spring.jpa.open-in-view=false

# ─── Jackson ──────────────────────────────────────────────────
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.date-format=yyyy-MM-dd'T'HH:mm:ss
spring.jackson.deserialization.fail-on-unknown-properties=false
spring.jackson.serialization.fail-on-empty-beans=false

# ─── Logging ──────────────────────────────────────────────────
logging.level.com.ticketsystem=INFO
logging.level.org.springframework.web=WARN
logging.level.org.hibernate.SQL=WARN
